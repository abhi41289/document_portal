name: Run Quality Checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: |
          pytest tests/test_unit_cases.py tests/test_routes.py

      - name: Run QA benchmark suite
        run: |
          pytest tests/qa -m "not quality_gate"

      - name: Run quality gate
        run: |
          pytest tests/qa/test_quality_gate.py --quality-gate --qa-artifacts=qa-artifacts
